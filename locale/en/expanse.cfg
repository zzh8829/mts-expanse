map_info_text_space=Rocket silos are found, not built. Each belongs to a ship. Bring what the ship asks for to the cargo chest beside its silo, and the rocket is loaded and launched for you. In return the ship sends resources from other planets to your landing pad. Open Space missions (rocket icon, top left) to see what each ship needs.
map_info_text=Your team starts on a tiny island. The blue chests on its edge are hungry: open one to see what it wants, deliver it, and the land behind it opens.\n\nA coin in a hungry chest swaps its request for a new one. Opened chests sometimes drop coins.\n\nThe tree and the rock at spawn never run out. Mining productivity research also grows your inventory. A tank of sulfuric acid next to the rock makes it give uranium once you have the research.\n\nRed warning signs mark where biters may land. When enough are marked, an invasion is announced ahead of time.
